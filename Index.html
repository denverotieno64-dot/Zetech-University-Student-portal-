<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zetech University - Digital School eLearning Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div id="loginPage" class="min-h-screen bg-gradient-to-br from-blue-900 to-blue-700 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
            <div class="text-center mb-8">
                <div class="w-24 h-24 mx-auto bg-blue-600 rounded-full flex items-center justify-center">
                    <i class="fas fa-graduation-cap text-white text-4xl"></i>
                </div>
                <h1 class="text-2xl font-bold mt-4">Zetech Digital School</h1>
                <p class="text-gray-500">eLearning Portal Login</p>
            </div>
            <form id="loginForm">
                <input type="text" id="loginRegNumber" placeholder="Registration Number (e.g., STU001)" class="w-full mb-3 px-4 py-3 border rounded-lg" required>
                <input type="password" id="loginPassword" placeholder="Password" class="w-full mb-4 px-4 py-3 border rounded-lg" required>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">Login</button>
            </form>
            <p class="text-center text-gray-500 mt-4 text-sm">Demo: STU001 / password123</p>
            <button onclick="showRegister()" class="w-full mt-3 border border-blue-600 text-blue-600 py-3 rounded-lg">Create Account</button>
        </div>
    </div>

    <div id="registerPage" class="min-h-screen bg-gradient-to-br from-blue-900 to-blue-700 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
            <h2 class="text-2xl font-bold text-center mb-6">Student Registration</h2>
            <form id="registerForm">
                <input type="text" id="regFullName" placeholder="Full Name" class="w-full mb-3 px-4 py-3 border rounded-lg" required>
                <input type="text" id="regNumber" placeholder="Registration Number" class="w-full mb-3 px-4 py-3 border rounded-lg" required>
                <input type="email" id="regEmail" placeholder="Email" class="w-full mb-3 px-4 py-3 border rounded-lg" required>
                <input type="password" id="regPassword" placeholder="Password" class="w-full mb-4 px-4 py-3 border rounded-lg" required>
                <select id="regProgram" class="w-full mb-4 px-4 py-3 border rounded-lg">
                    <option>Computer Science</option>
                    <option>Business Administration</option>
                    <option>Information Technology</option>
                </select>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg">Register</button>
            </form>
            <button onclick="showLogin()" class="w-full mt-3 text-blue-600 py-2">Back to Login</button>
        </div>
    </div>

    <div id="dashboardPage" class="hidden">
        <nav class="bg-gradient-to-br from-blue-900 to-blue-700 text-white p-4 sticky top-0">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fas fa-graduation-cap text-2xl"></i>
                    <span class="font-bold">Zetech Digital School</span>
                </div>
                <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded-lg">Logout</button>
            </div>
        </nav>
        <div class="container mx-auto p-4 max-w-6xl">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-xl p-6 shadow">
                    <i class="fas fa-book-open text-blue-500 text-3xl"></i>
                    <p class="text-gray-500 mt-2">Courses</p>
                    <p id="statCourses" class="text-3xl font-bold">0</p>
                </div>
                <div class="bg-white rounded-xl p-6 shadow">
                    <i class="fas fa-tasks text-orange-500 text-3xl"></i>
                    <p class="text-gray-500 mt-2">Assignments</p>
                    <p id="statAssignments" class="text-3xl font-bold">0</p>
                </div>
                <div class="bg-white rounded-xl p-6 shadow">
                    <i class="fas fa-chart-line text-green-500 text-3xl"></i>
                    <p class="text-gray-500 mt-2">GPA</p>
                    <p id="statGPA" class="text-3xl font-bold">0.00</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow mb-6">
                <div class="flex border-b overflow-x-auto">
                    <button onclick="showTab('courses')" id="tabCoursesBtn" class="px-4 py-3 font-semibold text-blue-600 border-b-2 border-blue-600">My Courses</button>
                    <button onclick="showTab('allCourses')" id="tabAllCoursesBtn" class="px-4 py-3 font-semibold text-gray-600">All Courses</button>
                    <button onclick="showTab('grades')" id="tabGradesBtn" class="px-4 py-3 font-semibold text-gray-600">Grades</button>
                </div>
                <div id="coursesTab" class="p-4"><div id="myCoursesList"></div></div>
                <div id="allCoursesTab" class="p-4 hidden"><div id="allCoursesList" class="grid grid-cols-1 gap-3"></div></div>
                <div id="gradesTab" class="p-4 hidden"><div id="gradesList"></div></div>
            </div>

            <div class="bg-white rounded-xl shadow p-4">
                <h3 class="font-bold text-lg mb-2"><i class="fas fa-bullhorn text-blue-500"></i> Announcements</h3>
                <div id="announcementsList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/.netlify/functions/api';
        
        function showToast(msg) {
            alert(msg); // Simple alert for mobile
        }

        async function apiCall(endpoint, method = 'GET', data = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (data) options.body = JSON.stringify(data);
            const response = await fetch(`${API_URL}?route=${endpoint}`, options);
            return await response.json();
        }

        document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const result = await apiCall('login', 'POST', {
                reg_number: document.getElementById('loginRegNumber').value,
                password: document.getElementById('loginPassword').value
            });
            if (result.success) {
                localStorage.setItem('user', JSON.stringify(result.user));
                location.reload();
            } else alert(result.error);
        });

        document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const result = await apiCall('register', 'POST', {
                reg_number: document.getElementById('regNumber').value,
                full_name: document.getElementById('regFullName').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value,
                program: document.getElementById('regProgram').value
            });
            if (result.success) { alert('Registered! Please login'); showLogin(); }
            else alert(result.error);
        });

        async function loadDashboard() {
            const data = await apiCall('dashboard');
            if (data.courses) {
                document.getElementById('statCourses').innerText = data.courses;
                document.getElementById('statAssignments').innerText = data.pending_assignments;
                document.getElementById('statGPA').innerText = data.gpa;
            }
            await loadMyCourses();
            await loadAllCourses();
            await loadGrades();
            await loadAnnouncements();
        }

        async function loadMyCourses() {
            const courses = await apiCall('my-courses');
            document.getElementById('myCoursesList').innerHTML = courses.map(c => `
                <div class="bg-gray-50 rounded-lg p-3 mb-2 border">
                    <b>${c.course_code}</b> - ${c.course_name}<br>
                    <small class="text-gray-600">${c.school_name || ''} | Credits: ${c.credits}</small>
                    ${c.grade ? `<br><span class="text-green-600">Grade: ${c.grade}%</span>` : ''}
                </div>
            `).join('');
        }

        async function loadAllCourses() {
            const courses = await apiCall('courses');
            document.getElementById('allCoursesList').innerHTML = courses.map(c => `
                <div class="bg-gray-50 rounded-lg p-3 border">
                    <b>${c.course_code}</b> - ${c.course_name}<br>
                    <small>${c.school_name} | ${c.credits} credits</small>
                    <p class="text-sm text-gray-600 mt-1">${c.description || ''}</p>
                </div>
            `).join('');
        }

        async function loadGrades() {
            const grades = await apiCall('grades');
            document.getElementById('gradesList').innerHTML = grades.map(g => `
                <div class="flex justify-between border-b py-2">
                    <span><b>${g.course_code}</b> ${g.course_name}</span>
                    <span class="font-bold">${g.grade}% (${g.letter_grade})</span>
                </div>
            `).join('');
        }

        async function loadAnnouncements() {
            const announcements = await apiCall('announcements');
            document.getElementById('announcementsList').innerHTML = announcements.map(a => `
                <div class="border-b py-2">
                    <b>${a.title}</b>
                    <p class="text-sm">${a.content}</p>
                    <small class="text-gray-500">${a.created_at}</small>
                </div>
            `).join('');
        }

        function showTab(tab) {
            document.getElementById('coursesTab').classList.add('hidden');
            document.getElementById('allCoursesTab').classList.add('hidden');
            document.getElementById('gradesTab').classList.add('hidden');
            document.getElementById(`${tab}Tab`).classList.remove('hidden');
        }

        function showRegister() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('registerPage').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('registerPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('user');
            location.reload();
        }

        const savedUser = localStorage.getItem('user');
        if (savedUser && document.getElementById('dashboardPage')) {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
            loadDashboard();
        }
    </script>
</body>
  </html>
